name: Verify CTEM Queue Copy
on:
  push:
    branches: [feat/ctem-action-queue-copy]
    paths: [.github/workflows/ctem-copy-review.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flytohub/flyto-i18n' && github.ref == 'refs/heads/feat/ctem-action-queue-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flyto-i18n
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: flyto-i18n
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Read current generation context before source changes
        working-directory: flyto-indexer
        run: |
          mkdir -p ../flyto-i18n/out/ctem-copy
          python3 -m src.cli scan ../flyto-i18n --full > ../flyto-i18n/out/ctem-copy/index-before.log 2>&1
          python3 -m src.cli context --path ../flyto-i18n --query 'build-dist translation source catalog merge' > ../flyto-i18n/out/ctem-copy/context.log 2>&1
          python3 -m src.cli impact build_dist --path ../flyto-i18n > ../flyto-i18n/out/ctem-copy/impact.log 2>&1
      - name: Apply additive reviewed copy
        run: |
          python3 - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          payload=''
          # This is an encoded reviewed text catalog, not executable input.
          data=json.loads(gzip.decompress(base64.b64decode(payload)))
          for directory in sorted(Path('locales/code').iterdir()):
              if not directory.is_dir(): continue
              locale=directory.name
              target=directory/'ctemQueue.json'
              assert not target.exists(), str(target)
              values={f'ctemQueue.{key}': value[1 if locale=='zh-TW' else 0] for key,value in data.items()}
              target.write_text(json.dumps({'$schema':'../../../schema/locale.schema.json','category':'code','version':'1.0.0','locale':locale,'total_keys':len(values),'translations':values},ensure_ascii=False,indent=2)+'\n')
          changelog=Path('CHANGELOG.md')
          text=changelog.read_text()
          heading,separator,rest=text.partition('\n')
          changelog.write_text(heading+'\n\n## CTEM action queue copy — 2026-09-19\n\nAdd source-owned queue purpose, loaded-window counts, priority context, review dialogs and explicit remediation-versus-verification language. English and Traditional Chinese are reviewed; other locales use explicit English fallback. This does not establish a frontend deployment.\n'+separator+rest)
          PY
          git rm .github/workflows/ctem-copy-review.yml
      - name: Validate and generate complete distributions
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt 'pytest>=9.0.3,<10' > out/ctem-copy/install.log 2>&1
          npm run docs:write > out/ctem-copy/docs.log 2>&1
          npm run verify > out/ctem-copy/verify.log 2>&1
      - name: Verify indexed output and stage exact tree
        run: |
          set -euo pipefail
          (cd ../flyto-indexer && python3 -m src.cli scan ../flyto-i18n --full && python3 -m src.cli verify ../flyto-i18n --strict --json) > out/ctem-copy/index-after.log 2>&1
          git add -u
          git add locales/code/*/ctemQueue.json
          git diff --cached --check
          git diff --cached --binary > out/ctem-copy/validated.patch
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/ctem-gitleaks.tgz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/ctem-gitleaks.tgz' | sha256sum -c -
          tar -xzf /tmp/ctem-gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks stdin --redact --no-banner --exit-code 1 < out/ctem-copy/validated.patch
      - name: Record validated objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def api(path,body):return json.loads(subprocess.check_output(['gh','api','repos/flytohub/flyto-i18n/'+path,'--method','POST','--input','-'],input=json.dumps(body).encode()))
          entries=[]
          for name in git('diff','--cached','--name-only').splitlines():
              assert name.startswith(('locales/code/','dist/','docs/')) or name in ['CHANGELOG.md','.github/workflows/ctem-copy-review.yml'],name
              p=Path(name)
              sha=api('git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})['sha'] if p.exists() else None
              if sha:assert sha==git('hash-object',name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          parent=git('rev-parse','HEAD');tree=git('write-tree')
          assert api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']==tree
          commit=api('git/commits',{'message':'feat(ctem): add action-first queue copy and generated catalogs','tree':tree,'parents':[parent]})
          receipt={'parent':parent,'tree':tree,'commit':commit['sha'],'entries':entries,'branch_updated':False,'deployed':False}
          Path('out/ctem-copy/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('VERIFIED_COMMIT='+commit['sha'])
          PY
      - name: Diagnostics
        if: always()
        run: |
          for file in out/ctem-copy/*.log; do test ! -f "$file" || { echo "== $file =="; tail -n 15 "$file"; }; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ctem-copy-review
          path: flyto-i18n/out/ctem-copy/
          retention-days: 3

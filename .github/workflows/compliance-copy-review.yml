name: Compliance copy review
on:
  push:
    branches: [refactor/compliance-evidence-copy]
    paths: ['.github/workflows/compliance-copy-review.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'flytohub/flyto-i18n' && github.ref == 'refs/heads/refactor/compliance-evidence-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: flyto-i18n
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Inspect locale generation before changes
        working-directory: flyto-indexer
        run: |
          mkdir -p ../evidence
          python3 -m src.cli scan ../flyto-i18n --full > ../evidence/index-before.log 2>&1
          python3 -m src.cli context --path ../flyto-i18n --query 'build-dist validate locales/code' >> ../evidence/index-before.log 2>&1
          python3 -m src.cli impact build_dist --path ../flyto-i18n >> ../evidence/index-before.log 2>&1
      - name: Apply exact copy and regenerate canonical distributions
        working-directory: flyto-i18n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/flytohub/flyto-i18n/git/blobs/ddcf792f6ba4fd9ea4548c557d0de1652fd168ff --jq .content | base64 --decode > ../evidence/apply.py
          test "$(git hash-object ../evidence/apply.py)" = ddcf792f6ba4fd9ea4548c557d0de1652fd168ff
          python3 ../evidence/apply.py
          git rm .github/workflows/compliance-copy-review.yml
          python3 scripts/validate.py --strict > ../evidence/validate.log 2>&1
          python3 scripts/build-dist.py > ../evidence/build.log 2>&1
          python3 scripts/validate.py --strict >> ../evidence/validate.log 2>&1
          git add locales/code/en/complianceReview.json locales/code/zh-TW/complianceReview.json dist manifest.json CHANGELOG.md
          git diff --cached --check
          git diff --cached --binary > ../evidence/validated.patch
      - name: Strict post-change verification
        working-directory: flyto-indexer
        run: |
          python3 -m src.cli scan ../flyto-i18n --full > ../evidence/index-after.log 2>&1
          python3 -m src.cli verify ../flyto-i18n --strict --json >> ../evidence/index-after.log 2>&1
      - name: Secret scan and record candidate without moving branches
        working-directory: flyto-i18n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks stdin --redact --no-banner --exit-code 1 < ../evidence/validated.patch
          python3 - <<'PY'
          import base64, json, subprocess
          from pathlib import Path
          def git(*a): return subprocess.check_output(['git', *a], text=True).strip()
          def api(p,d): return json.loads(subprocess.check_output(['gh','api','repos/flytohub/flyto-i18n/'+p,'--method','POST','--input','-'],input=json.dumps(d).encode()))
          assert not git('diff','--name-only'), 'Unstaged changes'
          names=git('diff','--cached','--name-only').splitlines()
          allowed={'CHANGELOG.md','manifest.json','.github/workflows/compliance-copy-review.yml','locales/code/en/complianceReview.json','locales/code/zh-TW/complianceReview.json'}
          assert all(n in allowed or n.startswith('dist/') for n in names), names
          entries=[]
          for n in names:
              sha=None
              if Path(n).exists():
                  sha=api('git/blobs', {'content':base64.b64encode(Path(n).read_bytes()).decode(),'encoding':'base64'})['sha']
                  assert sha==git('hash-object',n)
              entries.append({'path':n,'mode':'100644','type':'blob','sha':sha})
          tree=api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert tree==git('write-tree')
          candidate=api('git/commits',{'tree':tree,'parents':[git('rev-parse','HEAD')],'message':'feat(i18n): add evidence-aware compliance review copy and canonical bundles'})['sha']
          receipt={'candidate':candidate,'tree':tree,'parent':git('rev-parse','HEAD'),'main_updated':False}
          Path('../evidence/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CANDIDATE_RECEIPT='+json.dumps(receipt))
          PY
      - name: Diagnostics
        if: always()
        run: |
          for f in evidence/validate.log evidence/build.log evidence/index-after.log; do test ! -f "$f" || tail -n 45 "$f"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: compliance-copy-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error

name: Validate Translations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flyto-engine's module catalog is the only module registry. The catalog
      # copy contract (tests/test_module_catalog_copy.py) reads it and fails
      # under CI when it is missing, so this checkout is required, not optional.
      # FLYTO_ENGINE_TOKEN needs read access to flytohub/flyto-engine contents.
      # Fork pull requests receive no secrets and fail here by design; push the
      # branch to this repository to validate it.
      - name: Checkout flyto-engine module catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flytohub/flyto-engine
          ref: main
          path: .sync-source/flyto-engine
          token: ${{ secrets.FLYTO_ENGINE_TOKEN }}
          persist-credentials: false
          sparse-checkout: internal/modulecatalog/catalog.yaml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt "pytest>=9.0.3,<10"

      - name: Lint scripts
        run: npm run lint

      - name: Run translation tests
        env:
          FLYTO_ENGINE_CATALOG: ${{ github.workspace }}/.sync-source/flyto-engine/internal/modulecatalog/catalog.yaml
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Validate manifest.json
        run: |
          python -c "
          import json
          with open('manifest.json') as f:
              data = json.load(f)
          assert 'name' in data
          assert 'version' in data
          assert 'locales' in data
          print('manifest.json is valid')
          "

      - name: Run Flyto2 verify gate
        run: |
          python -m pip install "flyto-indexer @ git+https://github.com/flytohub/flyto-indexer@1b624987b15ef7cd2361370478d07ea36e5aa5ee"
          flyto-index verify . --json

name: Complete CTEM Catalog Verification
on:
  push:
    branches: [feat/ctem-action-queue-copy]
    paths: [.github/workflows/ctem-copy-delivery.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flytohub/flyto-i18n' && github.ref == 'refs/heads/feat/ctem-action-queue-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flyto-i18n
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: flyto-i18n
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Reproduce reviewed catalog and complete all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 - <<'PY'
          import base64,gzip,re,subprocess,yaml
          from pathlib import Path
          recipe=yaml.safe_load(Path('.github/workflows/ctem-copy-review.yml').read_text())
          steps=recipe['jobs']['verify']['steps']
          source=next(step['run'] for step in steps if step.get('name')=='Apply additive reviewed copy')
          assert source.count('EuX/7IDB')==1
          source=source.replace('EuX/7IDB','EuX/IDB')
          gzip.decompress(base64.b64decode(re.search(r"payload='([^']+)'",source).group(1)))
          subprocess.run(['git','rm','.github/workflows/ctem-copy-recover.yml','.github/workflows/ctem-copy-delivery.yml'],check=True)
          names=['Read current generation context before source changes','Apply additive reviewed copy','Validate and generate complete distributions','Verify indexed output and stage exact tree','Record validated objects without moving a branch']
          for name in names:
              step=next(step for step in steps if step.get('name')==name)
              script=source if name=='Apply additive reviewed copy' else step['run']
              if name=='Record validated objects without moving a branch':
                  old="['CHANGELOG.md','.github/workflows/ctem-copy-review.yml']"
                  new="['CHANGELOG.md','manifest.json','.github/workflows/ctem-copy-review.yml','.github/workflows/ctem-copy-recover.yml','.github/workflows/ctem-copy-delivery.yml']"
                  assert old in script
                  script=script.replace(old,new)
              cwd='../flyto-indexer' if name=='Read current generation context before source changes' else '.'
              print('VERIFY_STEP='+name,flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',script],cwd=cwd,check=True)
          PY
      - name: Diagnostics
        if: always()
        run: |
          for file in out/ctem-copy/*.log; do test ! -f "$file" || { echo "== $file =="; tail -n 12 "$file"; }; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ctem-copy-delivery
          path: flyto-i18n/out/ctem-copy/
          retention-days: 3
          if-no-files-found: error

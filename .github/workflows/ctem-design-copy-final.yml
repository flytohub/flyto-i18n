name: Complete Approved CTEM Copy Verification
on:
  push:
    branches: [feat/ctem-approved-design-copy]
    paths: [.github/workflows/ctem-design-copy-final.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flytohub/flyto-i18n' && github.ref == 'refs/heads/feat/ctem-approved-design-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flyto-i18n
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: flyto-i18n
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Execute reviewed recipe against the flattened namespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          recipe=yaml.safe_load(Path('.github/workflows/ctem-design-copy-review.yml').read_text())
          subprocess.run(['git','rm','.github/workflows/ctem-design-copy-final.yml'],check=True)
          for step in recipe['jobs']['verify']['steps']:
              if 'run' not in step or step.get('name')=='Diagnostics':continue
              script=step['run']
              if step['name']=='Validate and generate complete catalogs':
                  old="text=root.get('code',root).get('ctemDesign',{})"
                  assert old in script
                  script=script.replace(old,"text=root.get('ctemDesign') or root.get('code',{}).get('ctemDesign',{})")
              if step['name']=='Scan and retain exact validated tree without moving a branch':
                  old="['manifest.json','CHANGELOG.md','.github/workflows/ctem-design-copy-review.yml']"
                  assert old in script
                  script=script.replace(old,"['manifest.json','CHANGELOG.md','.github/workflows/ctem-design-copy-review.yml','.github/workflows/ctem-design-copy-final.yml']")
              cwd='../flyto-indexer' if step.get('working-directory')=='flyto-indexer' else '.'
              print('VERIFY_STEP='+step['name'],flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',script],cwd=cwd,check=True)
          PY
      - name: Diagnostics
        if: always()
        run: |
          for file in out/ctem-design-copy/*.log; do
            case "$file" in *context.log|*impact.log) continue ;; esac
            test ! -f "$file" || { echo "== $file =="; tail -n 15 "$file"; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ctem-approved-design-copy
          path: flyto-i18n/out/ctem-design-copy/
          retention-days: 5
          if-no-files-found: error

name: Verify Approved CTEM Design Copy
on:
  push:
    branches: [feat/ctem-approved-design-copy]
    paths: [.github/workflows/ctem-design-copy-review.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flytohub/flyto-i18n' && github.ref == 'refs/heads/feat/ctem-approved-design-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flyto-i18n
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: flyto-i18n
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Inspect generation dependencies before changes
        working-directory: flyto-indexer
        run: |
          set -euo pipefail
          mkdir -p ../flyto-i18n/out/ctem-design-copy
          python3 -m src.cli scan ../flyto-i18n --full > ../flyto-i18n/out/ctem-design-copy/index-before.log 2>&1
          python3 -m src.cli context --path ../flyto-i18n --query 'build-dist validate generate-reference' > ../flyto-i18n/out/ctem-design-copy/context.log 2>&1
          python3 -m src.cli impact build_dist --path ../flyto-i18n > ../flyto-i18n/out/ctem-design-copy/impact.log 2>&1
      - name: Apply authored copy and remove temporary helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          result=json.loads(subprocess.check_output(['gh','api','repos/flytohub/flyto-i18n/git/blobs/5aa94bdfc9f7adc770ee810e6b649c52422160f7']))
          copy=json.loads(base64.b64decode(result['content']))
          assert set(copy['en'])==set(copy['zh-TW'])
          for locale in Path('locales').iterdir():
              target=locale/'code'
              if not target.is_dir():continue
              dest=target/'ctemDesign.json'
              assert not dest.exists(),str(dest)
              values=copy.get(locale.name,copy['en'])
              doc={'$schema':'../../../schema/locale.schema.json','category':'code','version':'1.0.0','locale':locale.name,'total_keys':len(values),'translations':{'ctemDesign.'+k:v for k,v in values.items()}}
              dest.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          change=Path('CHANGELOG.md')
          text=change.read_text(); pos=text.find('\n')+1
          change.write_text(text[:pos]+'\n## 2026-09-19 — Approved CTEM design\n\nAdd source-owned English and Traditional Chinese labels for the approved CTEM layout, missing lifecycle statistics, evidence dialogs and linked-alert tools. Other locales explicitly use English fallback for these new keys. Existing translations remain unchanged.\n'+text[pos:])
          PY
          git rm .github/workflows/ctem-design-copy-review.yml
      - name: Validate and generate complete catalogs
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt > out/ctem-design-copy/install.log 2>&1
          python3 scripts/validate.py --strict > out/ctem-design-copy/validation.log 2>&1
          python3 scripts/build-dist.py > out/ctem-design-copy/build.log 2>&1
          python3 scripts/generate-reference.py --write > out/ctem-design-copy/docs.log 2>&1
          python3 scripts/generate-reference.py >> out/ctem-design-copy/docs.log 2>&1
          python3 -m pytest -q > out/ctem-design-copy/tests.log 2>&1
          git add locales dist manifest.json CHANGELOG.md docs
          git diff --cached --check
      - name: Verify indexed final source
        working-directory: flyto-indexer
        run: |
          set -euo pipefail
          python3 -m src.cli scan ../flyto-i18n --full > ../flyto-i18n/out/ctem-design-copy/index-after.log 2>&1
          python3 -m src.cli verify ../flyto-i18n --strict --json > ../flyto-i18n/out/ctem-design-copy/index-verify.json
      - name: Scan and retain exact validated tree without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --cached --binary > out/ctem-design-copy/validated.patch
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks stdin --redact --no-banner --exit-code 1 < out/ctem-design-copy/validated.patch
          python3 - <<'PY'
          import base64,json,subprocess,time
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              for attempt in range(5):
                  result=subprocess.run(['gh','api','repos/flytohub/flyto-i18n/'+endpoint,'--method','POST','--input','-'],input=json.dumps(body).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if result.returncode==0:return json.loads(result.stdout)
                  if attempt==4:raise RuntimeError('Object upload failed: '+endpoint)
                  time.sleep(2**attempt)
          entries=[]
          for name in git('diff','--cached','--name-only').splitlines():
              assert name.startswith(('locales/','dist/','docs/')) or name in ['manifest.json','CHANGELOG.md','.github/workflows/ctem-design-copy-review.yml'],name
              p=Path(name); sha=None
              if p.exists():sha=api('git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})['sha'];assert sha==git('hash-object',name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          expected=git('write-tree'); base=git('rev-parse','HEAD^{tree}')
          assert api('git/trees',{'base_tree':base,'tree':entries})['sha']==expected
          commit=api('git/commits',{'message':'feat(ctem): approved-design copy and honest evidence states','tree':expected,'parents':[git('rev-parse','HEAD')]})
          receipt={'parent':git('rev-parse','HEAD'),'tree':expected,'commit':commit['sha'],'entries':entries,'branch_updated':False,'deployed':False}
          Path('out/ctem-design-copy/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Diagnostics
        if: always()
        run: |
          for file in out/ctem-design-copy/*.log; do
            case "$file" in *context.log|*impact.log) continue ;; esac
            test ! -f "$file" || { echo "== $file =="; tail -n 15 "$file"; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ctem-approved-design-copy
          path: flyto-i18n/out/ctem-design-copy/
          retention-days: 5
          if-no-files-found: error

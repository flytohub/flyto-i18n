name: Prepare Audit Review Translations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-review-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: flyto-i18n
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: flytohub/flyto-indexer
          ref: 8a3f741617fafdc99faeeb4d94d57b670f3b4077
          path: flyto-indexer
          persist-credentials: false
      - name: Index source and inspect build impact
        working-directory: flyto-indexer
        run: |
          mkdir -p ../flyto-i18n/out/audit-review
          python3 -m src.cli scan ../flyto-i18n --full > ../flyto-i18n/out/audit-review/index-before.log 2>&1
          python3 -m src.cli context --path ../flyto-i18n --query 'build-dist validate locales code' > ../flyto-i18n/out/audit-review/context.log 2>&1
          python3 -m src.cli impact validate_file --path ../flyto-i18n > ../flyto-i18n/out/audit-review/impact.log 2>&1
      - name: Restore reviewed translation payload
        working-directory: flyto-i18n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/flytohub/flyto-i18n/git/blobs/77d0e7a902275155d0014fd84a68ce62c4b6c68d --jq .content | base64 --decode > out/audit-review/translation-input.json
          test "$(git hash-object out/audit-review/translation-input.json)" = 77d0e7a902275155d0014fd84a68ce62c4b6c68d
          python3 - <<'PY'
          from pathlib import Path
          import json
          dictionaries = json.loads(Path('out/audit-review/translation-input.json').read_text())
          assert dictionaries['en'].keys() == dictionaries['zh-TW'].keys()
          for locale, translations in dictionaries.items():
              path = Path(f'locales/code/{locale}/auditReview.json')
              assert not path.exists()
              for file in path.parent.glob('*.json'):
                  old = json.loads(file.read_text()).get('translations', {})
                  assert not set(old).intersection(translations), f'Duplicate keys in {file}'
              path.write_text(json.dumps({'$schema': '../../../schema/locale.schema.json', 'category': 'code', 'version': '1.0.0', 'locale': locale, 'total_keys': len(translations), 'translations': translations}, ensure_ascii=False, indent=2) + '\n')
          path = Path('CHANGELOG.md')
          first, rest = path.read_text().split('\n', 1)
          path.write_text(first + '\n\n## 2026-09-17 — Audit review and score history\n\n- Add English and Traditional Chinese audit-review, report-scope and recorded-score history copy.\n- Regenerate the canonical distribution; no existing keys are replaced.\n' + rest)
          PY
      - name: Validate and regenerate canonical bundles
        working-directory: flyto-i18n
        run: |
          python3 scripts/validate.py --strict > out/audit-review/validation.log 2>&1
          python3 scripts/build-dist.py > out/audit-review/build.log 2>&1
          python3 scripts/validate.py --strict >> out/audit-review/validation.log 2>&1
          git rm .github/workflows/audit-review-prepare.yml
          git add locales/code/en/auditReview.json locales/code/zh-TW/auditReview.json CHANGELOG.md dist manifest.json
          git diff --cached --check
      - name: Publish validated Git tree without moving any branch
        working-directory: flyto-i18n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, base64, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args], text=True).strip()
          def api(path, data=None):
              args=['gh','api','repos/flytohub/flyto-i18n/'+path]
              if data is not None: args += ['--method','POST','--input','-']
              return json.loads(subprocess.check_output(args,input=None if data is None else json.dumps(data).encode()))
          parent=git('rev-parse','HEAD')
          assert api('commits/main')['sha']==parent
          names=git('diff','--cached','--name-only').splitlines()
          assert not git('diff','--name-only')
          allowed={'CHANGELOG.md','manifest.json','.github/workflows/audit-review-prepare.yml','locales/code/en/auditReview.json','locales/code/zh-TW/auditReview.json'}
          assert all(name in allowed or name.startswith('dist/') for name in names)
          entries=[]
          for name in names:
              sha=None
              if Path(name).exists():
                  sha=api('git/blobs',{'content':base64.b64encode(Path(name).read_bytes()).decode(),'encoding':'base64'})['sha']
                  assert sha==git('hash-object',name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert tree==git('write-tree')
          receipt={'parent':parent,'tree':tree,'files':names,'branch_updated':False}
          Path('out/audit-review/receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - name: Failure details
        if: failure()
        working-directory: flyto-i18n
        run: tail -n 50 out/audit-review/*.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: approved-audit-i18n
          path: flyto-i18n/out/audit-review/
          retention-days: 3
